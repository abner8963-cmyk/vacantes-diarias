name: Buscar vacantes

on:
  schedule:
    - cron: "0 12 * * 1-5"   # lunes a viernes, 12:00 UTC = 6:00 a.m. en Ciudad de México
  workflow_dispatch:          # botón «Run workflow» para ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: buscar-vacantes
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar vacantes
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: python buscar_vacantes.py

      - name: Guardar resultados y contador
        if: always()   # el contador se guarda aunque la búsqueda falle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A resultados uso.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Vacantes $(TZ=America/Mexico_City date +%F)"
            git pull --rebase --quiet
            git push
          fi
